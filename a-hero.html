<!-- ============ 区块：首屏 Hero ============
     可改内容在 js/site.config.js 的 hero 字段
     动效：标题逐词遮罩上浮 / 鼠标视差 / 环形文字旋转 -->
<section class="hero" id="top">
  <div class="hero__inner">
    <h1 class="hero__title">
      {{#each hero.lines}}<span class="reveal-line"><span class="hero__line-inner{{#if italic}} is-italic{{/if}}">{{text}}</span></span>{{/each}}
    </h1>

    <div class="hero__bottom">
      <p class="hero__sub reveal-line"><span data-reveal data-reveal-delay="420">{{hero.subtitle}}</span></p>

      <a class="magnetic hero__cta" href="{{hero.cta.href}}" data-cursor="Say hi">
        <span class="btn-pill"><span class="dot"></span><span class="magnetic__in">{{hero.cta.label}}</span></span>
      </a>
    </div>
  </div>

  <div class="hero__cue" aria-hidden="true">
    <span class="hero__cue-line"></span>
    <span>{{hero.scrollCue}}</span>
  </div>

  <div class="hero__badge" aria-hidden="true">
    <svg viewBox="0 0 120 120" class="hero__badge-svg">
      <defs>
        <path id="badgeCircle" d="M60,60 m-42,0 a42,42 0 1,1 84,0 a42,42 0 1,1 -84,0" />
      </defs>
      <text>
        <textPath href="#badgeCircle">数字媒体设计 · 界面与交互 · 南充电影工业职业学院 · </textPath>
      </text>
    </svg>
    <span class="hero__badge-core">↘</span>
  </div>
</section>
